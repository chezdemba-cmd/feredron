name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: djeli
          POSTGRES_PASSWORD: djeli
          POSTGRES_DB: djeli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://djeli:djeli@localhost:5432/djeli_test?schema=public
      # Pas de pooler en CI : DIRECT_URL = DATABASE_URL (requis par `prisma
      # migrate deploy`, cf. prisma/schema.prisma).
      DIRECT_URL: postgresql://djeli:djeli@localhost:5432/djeli_test?schema=public
      AUTH_SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_ENV: staging
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit — dépendances runtime (bloquant sur CRITICAL)
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit — rapport complet (non bloquant)
        run: npm audit || true

      - name: Validate environment
        run: npm run check:env

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations (staging DB)
        run: npx prisma migrate deploy

      - name: Migration status (no drift)
        run: npx prisma migrate status

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + integration)
        run: npm test

      - name: Build
        run: npm run build
