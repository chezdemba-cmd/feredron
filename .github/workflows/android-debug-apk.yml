name: Build Android debug APK

# APK de test (non signé, non publié) pour installer directement sur un
# téléphone sans Android Studio local. Déclenchement manuel.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # android/capacitor-cordova-android-plugins/ est volontairement
      # gitignored (android/.gitignore) : c'est du code généré, régénéré ici
      # via `cap sync` plutôt que commité. Ne nécessite PAS `next build`
      # (mode WebView "remote hosted" — capacitor.config.ts n'a besoin que
      # des variables d'env, pas du build web).
      - name: Capacitor sync (android)
        # PRODUCTION_API_URL pilote server.url dans capacitor.config.ts — sans
        # elle, `cap sync` régénérerait une config vide (mode local) et
        # écraserait l'URL de prod déjà correcte dans le fichier committé.
        env:
          PRODUCTION_API_URL: https://feredron.vercel.app
        run: npx cap sync android

      # ubuntu-latest embarque déjà un SDK Android (ANDROID_HOME préconfiguré),
      # mais le binaire sdkmanager n'est pas sur le PATH par défaut — on le
      # localise et on ajoute son dossier au PATH pour les étapes suivantes.
      - name: Locate sdkmanager
        run: |
          SDKMGR=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager introuvable sous ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "sdkmanager trouve : $SDKMGR"
          dirname "$SDKMGR" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required SDK platform/build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: feredron-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
